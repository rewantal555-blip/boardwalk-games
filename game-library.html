<!doctype html>
<html lang="en">
  <head>

    <link

  <!-- classes in the body set to work with margin-top auto in the footer to ensure it always stays in the bottom of the page -->
  <body class="d-flex flex-column min-vh-100">
<!-- Navigation -->
 <div>navigation</div>

        <div class="col-12 col-xl-6">game intro</div>

    </div>
   
 </header>
 <!-- main element is hold  all key sections of the  page. it's not part of the grid structure -->
 <main>

       <div class="row">
        <div class="col-12">new games heading</div>

        <div class="col-12 col-md-6  col-xl-3">game card</div>

        <div class="col-12 col-md-6  col-xl-3">game card</div>
        <div class="col-12 col-md-6  col-xl-3">game card</div>
       </div>

 <!-- footer/ Contact section -->

 <footer class="mt-auto" >

</div>
    
 </footer>
